    <script>
    /* ui-titles: the pause / mute / skip buttons are icons whose hover tooltips (title) are hard-coded English, also when the
       code toggles them. On a non-English page each known English tooltip is replaced by the locale's _ui key below, now and
       whenever the code sets it again; the browser-tab title becomes _ui.pageTitle. Display only; missing keys leave the English. */
    (function(){
      var ld=window.__lessonData||{},p=new URLSearchParams(location.search);
      var loc=window.__locale||p.get('language')||p.get('locale')||ld.defaultLocale||'en';
      if(loc==='en')return;
      var K={'Pause':'pauseTitle','Resume':'resumeTitle','Pause/Resume':'pauseResumeTitle','Mute/Unmute':'muteUnmuteTitle','Skip to next slide':'skipSlideTitle','Skip to next step':'skipStepTitle'};
      function ui(){var d=window.__lessonData||ld;return ((d.locales||{})[window.__locale||loc]||{})._ui||{};}
      function fix(el){var t=el.getAttribute('title'),k=K[t],v=k&&ui()[k];if(v&&v!==t)el.setAttribute('title',v);}
      function start(){
        var pt=ui().pageTitle;if(pt)document.title=pt;
        document.querySelectorAll('[title]').forEach(fix);
        new MutationObserver(function(ms){
          ms.forEach(function(m){
            if(m.type==='attributes')fix(m.target);
            else m.addedNodes.forEach(function(n){if(n.nodeType===1){if(n.hasAttribute('title'))fix(n);n.querySelectorAll('[title]').forEach(fix);}});
          });
        }).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['title']});
      }
      if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
    })();
    </script>
    <script>
    /* as-digits: on Assamese pages every visible number is shown in Assamese digits (০-৯), on the canvas and in the page.
       Digits that belong to notation stay as written: a number touching a Latin letter (H2O, 2n², 2e⁻) or joined to a
       symbol by a hyphen (U-235); an equation number such as (4.4a) is converted. Display only — lesson data, narration and audio lookup are unchanged. */
    (function(){
      var ld=window.__lessonData||{},p=new URLSearchParams(location.search);
      var loc=window.__locale||p.get('language')||p.get('locale')||ld.defaultLocale||'en';
      if(loc!=='as')return;
      var AS='০১২৩৪৫৬৭৮৯',L=/[A-Za-z]/;
      function asDigits(s){
        return String(s).replace(/[0-9]+(?:[.,][0-9]+)*/g,function(m,i,str){
          var a=str.charAt(i-1),b=str.charAt(i+m.length);
          var eq=a==='('&&m.indexOf('.')>0&&/^[a-z]\)/.test(str.substr(i+m.length,2));
          if(!eq&&(L.test(a)||L.test(b)||(a==='-'&&L.test(str.charAt(i-2)))))return m;
          return m.replace(/[0-9]/g,function(d){return AS.charAt(+d);});
        });
      }
      window.__asDigits=asDigits;
      var P=CanvasRenderingContext2D.prototype;
      ['fillText','strokeText'].forEach(function(k){
        var o=P[k];
        P[k]=function(t){var a=Array.prototype.slice.call(arguments);a[0]=asDigits(t);return o.apply(this,a);};
      });
      var mt=P.measureText;
      P.measureText=function(t){return mt.call(this,asDigits(t));};
      var SKIP=/^(SCRIPT|STYLE|SUB|SUP|TEXTAREA|INPUT|CODE)$/;
      function walk(n){
        if(n.nodeType===3){
          if(n.parentNode&&SKIP.test(n.parentNode.nodeName))return;
          var v=n.nodeValue,w=asDigits(v);if(w!==v)n.nodeValue=w;
        }else if(n.nodeType===1&&!SKIP.test(n.nodeName)){
          for(var c=n.firstChild;c;c=c.nextSibling)walk(c);
        }
      }
      function start(){
        walk(document.body);
        new MutationObserver(function(ms){
          ms.forEach(function(m){if(m.type==='characterData')walk(m.target);else m.addedNodes.forEach(walk);});
        }).observe(document.body,{childList:true,subtree:true,characterData:true});
      }
      if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
    })();
    </script>

        class SpeechManager {
            constructor(){this.audio=null;this.isDestroyed=false;this.isPaused=false;this.pauseResolve=null;this._speakId=0;this._audioResolve=null;this.isFetching=false;}
            destroy(){this.isDestroyed=true;this.isPaused=false;if(this.audio){try{this.audio.pause();this.audio.currentTime=0;this.audio.src='';this.audio.load();this.audio.onended=null;this.audio.onerror=null;}catch(e){}this.audio=null;}if(this.pauseResolve){this.pauseResolve();this.pauseResolve=null;}if(this._audioResolve){const r=this._audioResolve;this._audioResolve=null;r();}const d=document.getElementById('speakingDot');if(d)d.classList.remove('active');}
            pause(){if(this.audio&&!this.isPaused){this.isPaused=true;this.audio.pause();const d=document.getElementById('speakingDot');if(d)d.classList.remove('active');}}
            resume(){if(this.pauseResolve){const r=this.pauseResolve;this.pauseResolve=null;r();}if(this.audio&&this.isPaused){this.isPaused=false;this.audio.play().catch(()=>{});const d=document.getElementById('speakingDot');if(d)d.classList.add('active');}}
            stopAudioOnly(){const dot=document.getElementById('speakingDot');if(dot)dot.classList.remove('active');if(this.audio){try{this.audio.pause();this.audio.src='';this.audio.load();}catch(e){}this.audio=null;}if(this._audioResolve){const r=this._audioResolve;this._audioResolve=null;r();}}
            async speak(text){
                if(this.isDestroyed||!text)return;const myId=++this._speakId;const isActive=()=>!this.isDestroyed&&this._speakId===myId;
                if(this.audio){try{this.audio.pause();this.audio.currentTime=0;this.audio.src='';this.audio.load();}catch(e){}this.audio=null;}
                if(this._audioResolve){const r=this._audioResolve;this._audioResolve=null;r();}
                this.isPaused=false;
                const dot=document.getElementById('speakingDot');if(dot)dot.classList.add('active');
                const idx=window.__lessonAudioIndex||{};const rel=idx[text];
                if(rel&&isActive()){await this._playFile(rel,isActive);}
                else{await this.waitWithPause(Math.max(800,text.length*38));}
                if(isActive()){const dot=document.getElementById('speakingDot');if(dot)dot.classList.remove('active');}
            }
            async _playFile(rel,isActive){return new Promise(resolve=>{if(!isActive()||this.isDestroyed){resolve();return;}const audio=new Audio(rel);this.audio=audio;audio.muted=state.isMuted;this._audioResolve=resolve;const done=()=>{this._audioResolve=null;this.audio=null;resolve();};audio.onended=done;audio.onerror=done;if(state.isPaused){this.isPaused=true;return;}audio.play().catch(()=>resolve());});}
            waitWithPause(ms){return new Promise(resolve=>{const st=Date.now();let el=0;const ch=()=>{if(this.isDestroyed){resolve();return;}if(state.isPaused){this.pauseResolve=()=>{this.pauseResolve=null;ch();};return;}el=Date.now()-st;if(el>=ms)resolve();else setTimeout(ch,Math.min(100,ms-el));};ch();});}
        }
        let speech = new SpeechManager();
        function createNewNarrator() {
            if (speech) speech.destroy();
            speech = new SpeechManager();
            currentRunId++;
            state.isPaused = false;
            const pb = document.getElementById('pauseToggle');
            if (pb) { pb.textContent = '⏸️'; pb.classList.remove('paused'); pb.title = 'Pause'; }
            return currentRunId;
        }

        };
        // ══════════════════ TREE / SCENE HELPERS ══════════════════
        // The manager asked for real top-to-bottom branching trees that GROW,
        // not rows of cards. These draw partial geometry from a 0→1 progress
        // value, so a trunk extends downward and each branch reaches its child
        // exactly while the narration names it.

        // Draws only the first `p` of a polyline — the basis of every growing line.
        function growPath(pts, p, { color = 'rgba(255,255,255,0.5)', width = 3, dash = false, cap = 'round' } = {}) {
            if (p <= 0 || pts.length < 2) return null;
            const segs = [];
            let total = 0;
            for (let i = 1; i < pts.length; i++) {
                const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
                segs.push(d); total += d;
            }
            let want = total * Math.min(1, p), tip = pts[0];
            ctx.save();
            if (dash) ctx.setLineDash([7, 6]);
            ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 0; i < segs.length; i++) {
                if (want <= 0) break;
                const f = Math.min(1, want / segs[i]);
                const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f;
                const y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
                ctx.lineTo(x, y); tip = [x, y];
                want -= segs[i];
            }
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = cap; ctx.lineJoin = 'round';
            ctx.stroke(); ctx.restore();
            return tip;
        }

        // An elbow from a parent's bottom to a child's top: down, across, down.
        function elbow(x0, y0, x1, y1, midY) {
            const m = midY === undefined ? (y0 + y1) / 2 : midY;
            return (Math.abs(x1 - x0) < 1) ? [[x0, y0], [x1, y1]] : [[x0, y0], [x0, m], [x1, m], [x1, y1]];
        }

        // A straight arrow (horizontal, vertical or diagonal) that grows from its
        // origin: the shaft is drawn only as far as `p`, and the head appears just
        // as the tip reaches the endpoint — the same contract growBranch() honours
        // for elbows. Head geometry matches draw.arrow() so styling is unchanged.
        function growArrow(x1, y1, x2, y2, p, { color = 'rgba(255,255,255,0.6)', width = 2.6, head = 9 } = {}) {
            const q = Math.max(0, Math.min(1, p));
            if (q <= 0) return;
            growPath([[x1, y1], [x2, y2]], q, { color, width });
            if (q >= 0.985) {
                const a = Math.atan2(y2 - y1, x2 - x1);
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - head * Math.cos(a - Math.PI / 6), y2 - head * Math.sin(a - Math.PI / 6));
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - head * Math.cos(a + Math.PI / 6), y2 - head * Math.sin(a + Math.PI / 6));
                ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke();
                ctx.restore();
            }
        }

        // A branch that grows and drops an arrowhead onto the child once it lands.
        function growBranch(x0, y0, x1, y1, p, { color = 'rgba(255,255,255,0.45)', width = 3, midY } = {}) {
            if (p <= 0) return;
            growPath(elbow(x0, y0, x1, y1, midY), p, { color, width });
            if (p >= 0.985) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x1, y1 + 2); ctx.lineTo(x1 - 7, y1 - 9); ctx.lineTo(x1 + 7, y1 - 9); ctx.closePath();
                ctx.fillStyle = color; ctx.fill(); ctx.restore();
            }
        }

        // A labelled node in a tree. `pop` gives it a spring as it lands.
        function treeNode(cx, cy, w, h, title, {
            sub = null, color = INDIGO, alpha = 1, pop = 1, titleSize = TYPE.subhead, subSize = TYPE.small, glow = true, fillA = 0.11
        } = {}) {
            if (alpha <= 0) return;
            ctx.save(); ctx.globalAlpha *= alpha;
            const k = 0.86 + 0.14 * Math.min(1, pop) + (pop < 1 ? Math.sin(pop * Math.PI) * 0.06 : 0);
            ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
            if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 3; }
            rr(cx - w / 2, cy - h / 2, w, h, 14, {
                fill: hexA(color, fillA), stroke: hexA(color, 0.72), width: 1.7
            });
            ctx.shadowBlur = 0;
            if (sub) {
                draw.text(title, cx, cy - h * 0.13, { size: titleSize, color: '#fff', weight: '800', maxW: w * 0.88 });
                draw.text(sub, cx, cy + h * 0.2, { size: subSize, color: 'rgba(255,255,255,0.82)', weight: '600', maxW: w * 0.88 });
            } else {
                draw.text(title, cx, cy + titleSize * 0.06, { size: titleSize, color: '#fff', weight: '800', maxW: w * 0.88 });
            }
            ctx.restore();
        }

        function hexA(hex, a) {
            if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
            const h = hex.replace('#', '');
            const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
            return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }

        // ── stage furniture ────────────────────────────────────────
        // Big scene title. Sizes follow the manager's guidance: main concept 24–32.
        function sceneTitle(str, a, { y = 34, color = INDIGO, size = TYPE.title } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            draw.text(str, center.x, y, { size, color, weight: '800' });
            ctx.restore();
        }
        // The single big takeaway line — the thing the learner should remember.
        // The single big takeaway. Typographic by default — a rule above the
        // words rather than a bordered card, so the stage keeps reading as a
        // scene instead of a dashboard. `boxed` is reserved for definitions.
        function bigStatement(str, a, { y = 486, color = AMBER, size = TYPE.heading, boxed = false } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            ctx.font = `800 ${size}px ${CANVAS_FONT}`;
            const w = ctx.measureText(str).width;
            if (boxed) {
                rr(center.x - w / 2 - 32, y - 26, w + 64, 52, 16, { fill: hexA(color, 0.13), stroke: color, width: 2 });
            } else {
                // short accent rule, drawn in from the centre
                const rw = Math.min(w * 0.5, 150) * Math.min(1, a * 1.4);
                rr(center.x - rw / 2, y - 24, rw, 3, 1.5, { fill: color });
            }
            ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 10;
            draw.text(str, center.x, y + 4, { size, color: '#fff', weight: '800' });
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // A floating annotation for graph scenes: a short colour bar and plain
        // type. Replaces the bordered side-cards so the graph stays dominant.
        function noteBlock(x, y, color, lines, a, { align = 'left', lead = 22 } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            const h = lines.length * lead + 6;
            rr(x - 3, y - 14, 3, h, 1.5, { fill: color });
            ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10;
            lines.forEach((L, i) => {
                draw.text(L.t, x + 12, y + i * lead, {
                    size: L.size || 15, color: L.c || 'rgba(255,255,255,0.92)',
                    weight: L.w || '700', align
                });
            });
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // A caption under a large object.
        function caption(str, x, y, a, { color = '#fff', size = TYPE.label, weight = '800' } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 10;
            draw.text(str, x, y, { size, color, weight });
            ctx.shadowBlur = 0; ctx.restore();
        }
        function subCaption(str, x, y, a, { color = 'rgba(255,255,255,0.68)', size = TYPE.body } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            draw.text(str, x, y, { size, color, weight: '600' });
            ctx.restore();
        }
        // The "why this is true" line. A coloured lead-in dot and plain text —
        // no container, since it is spoken narration made visible, not a panel.
        function reasonBar(str, x, y, a, { color = EMERALD, size = TYPE.body } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a;
            ctx.font = `700 ${size}px ${CANVAS_FONT}`;
            const w = ctx.measureText(str).width;
            ctx.beginPath(); ctx.arc(x - w / 2 - 16, y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.fill();
            ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 9;
            draw.text(str, x, y, { size, color: 'rgba(255,255,255,0.94)', weight: '700' });
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Ease helpers for movement-based animation (not just fades).
        const easeOut = p => 1 - Math.pow(1 - Math.max(0, Math.min(1, p)), 3);
        const easeInOut = p => { p = Math.max(0, Math.min(1, p)); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
        const lerp = (a, b, p) => a + (b - a) * Math.max(0, Math.min(1, p));

        // Moves an object along a path so it physically travels between concepts.
        function travel(x0, y0, x1, y1, p, { arc = 0 } = {}) {
            const e = easeInOut(p);
            return [lerp(x0, x1, e), lerp(y0, y1, e) - Math.sin(e * Math.PI) * arc];
        }
        // Camera-style zoom/pan around a focal point.
        function camera(fx, fy, zoom, apply) {
            ctx.save();
            ctx.translate(fx, fy); ctx.scale(zoom, zoom); ctx.translate(-fx, -fy);
            apply(); ctx.restore();
        }
        // Soft spotlight to push the eye to the current focus.
        function spotlight(x, y, r, a, color = '#ffffff') {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha *= a * 0.5;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, hexA(color, 0.22)); g.addColorStop(1, hexA(color, 0));
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
        // ══════════════════ GRAPH ENGINE ══════════════════
        // Chapter 8 and 9 are graph-driven in a way the Class 10 chapter never was.
        // makePlot returns a coordinate mapper for a fixed data range; the helpers
        // below draw axes, ticks, curves and markers ON TOP of it. Everything takes
        // an `alpha` and a `progress` so a curve can be drawn out gradually in step
        // with the sentence describing it.
        function makePlot(ox, oy, w, h, xMax, yMax) {
            return {
                ox, oy, w, h, xMax, yMax,
                X(v) { return ox + (v / xMax) * w; },
                Y(v) { return oy - (v / yMax) * h; }
            };
        }
        function plotAxes(P, { alpha = 1, grow = 1, xLabel = '', yLabel = '', xTicks = [], yTicks = [], axisCol = 'rgba(255,255,255,0.45)', gridCol = 'rgba(255,255,255,0.07)' } = {}) {
            if (alpha <= 0) return;
            ctx.save(); ctx.globalAlpha = alpha;
            // gridlines
            yTicks.forEach(t => { const y = P.Y(t); draw.line(P.ox, y, P.ox + P.w * grow, y, { color: gridCol, width: 1 }); });
            xTicks.forEach(t => { const x = P.X(t); draw.line(x, P.oy, x, P.oy - P.h * grow, { color: gridCol, width: 1 }); });
            // axes with arrowheads
            draw.arrow(P.ox, P.oy, P.ox + P.w * grow + 14, P.oy, { color: axisCol, width: 2 });
            draw.arrow(P.ox, P.oy, P.ox, P.oy - P.h * grow - 14, { color: axisCol, width: 2 });
            // ticks + numbers
            xTicks.forEach(t => {
                const x = P.X(t); if (x > P.ox + P.w * grow + 2) return;
                draw.line(x, P.oy, x, P.oy + 5, { color: axisCol, width: 1.5 });
                draw.text(String(t), x, P.oy + 18, { size: TYPE.small, color: 'rgba(255,255,255,0.6)' });
            });
            yTicks.forEach(t => {
                const y = P.Y(t); if (y < P.oy - P.h * grow - 2) return;
                draw.line(P.ox, y, P.ox - 5, y, { color: axisCol, width: 1.5 });
                draw.text(String(t), P.ox - 16, y, { size: TYPE.small, color: 'rgba(255,255,255,0.6)', align: 'right' });
            });
            draw.text('0', P.ox - 14, P.oy + 16, { size: TYPE.small, color: 'rgba(255,255,255,0.6)' });
            if (xLabel) draw.text(xLabel, P.ox + P.w / 2, P.oy + 40, { size: TYPE.small, color: SKY, weight: '700' });
            if (yLabel) {
                ctx.save(); ctx.translate(P.ox - 48, P.oy - P.h / 2); ctx.rotate(-Math.PI / 2);
                draw.text(yLabel, 0, 0, { size: TYPE.small, color: SKY, weight: '700' }); ctx.restore();
            }
            ctx.restore();
        }
        // Catmull-Rom densifier so the five plotted points join as one smooth,
        // outward-bowed curve rather than four straight segments.
        function spline(pts, samples = 180) {
            if (pts.length < 3) return pts.slice();
            const P = [pts[0], ...pts, pts[pts.length - 1]], out = [];
            for (let i = 0; i < P.length - 3; i++) {
                const p0 = P[i], p1 = P[i + 1], p2 = P[i + 2], p3 = P[i + 3];
                const n = Math.ceil(samples / (P.length - 3));
                for (let j = 0; j < n; j++) {
                    const t = j / n, t2 = t * t, t3 = t2 * t;
                    out.push([
                        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
                    ]);
                }
            }
            out.push(pts[pts.length - 1]);
            return out;
        }
        function plotCurve(P, data, { alpha = 1, progress = 1, color = SKY, width = 3, glow = true } = {}) {
            if (alpha <= 0 || progress <= 0) return;
            const dev = spline(data.map(d => [P.X(d[0]), P.Y(d[1])]));
            const upto = Math.max(2, Math.floor(dev.length * Math.min(1, progress)));
            ctx.save(); ctx.globalAlpha = alpha;
            if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 16; }
            ctx.beginPath(); ctx.moveTo(dev[0][0], dev[0][1]);
            for (let i = 1; i < upto; i++)ctx.lineTo(dev[i][0], dev[i][1]);
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
            ctx.restore();
        }
        function plotPoint(P, x, y, label, { alpha = 1, color = AMBER, r = 6, dashes = false, labelDx = 0, labelDy = -16 } = {}) {
            if (alpha <= 0) return;
            ctx.save(); ctx.globalAlpha = alpha;
            const px = P.X(x), py = P.Y(y);
            if (dashes) {
                draw.line(P.ox, py, px, py, { color: color + '66', width: 1.2, dash: true });
                draw.line(px, P.oy, px, py, { color: color + '66', width: 1.2, dash: true });
            }
            draw.circle(px, py, r, { fill: color, glow: true, glowColor: color });
            if (label) draw.text(label, px + labelDx, py + labelDy, { size: TYPE.small, color: '#fff', weight: '700' });
            ctx.restore();
        }

        // A consistent entrance for a revealed object: it fades in while
        // rising slightly and settling to full size. The small movement is what
        // makes a reveal read as deliberate rather than as a pop.
        function enterIn(cx, cy, p, fn) {
            if (p <= 0) return;
            const e = easeOut(Math.max(0, Math.min(1, p)));
            ctx.save();
            ctx.globalAlpha *= e;
            const k = 0.9 + 0.1 * e;
            ctx.translate(0, (1 - e) * 22);
            ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
            fn();
            ctx.restore();
        }

        // ══════════════════ NARRATION CUES ══════════════════
        // The beats of the step currently being spoken. Set by the flow loop so
        // visuals can ask "how far into this sentence is the word 'shoes'?"
        let CURRENT_BEATS = [];

        // Fraction (0-1) through beat `b` at which `phrase` begins, i.e. the
        // moment the learner actually hears it. `lead` shifts the reveal a
        // little earlier so the object is arriving as the word lands rather
        // than after it. Falls back to `dflt` if the phrase isn't found.
        function cue(b, phrase, { lead = 0.04, dflt = 0.3 } = {}) {
            const say = (CURRENT_BEATS[b] && CURRENT_BEATS[b].say) || '';
            if (!say) return dflt;
            const k = say.toLowerCase().indexOf(String(phrase).toLowerCase());
            if (k < 0) return dflt;
            return Math.max(0, Math.min(0.95, k / say.length - lead));
        }
        // Convenience: a gate window that opens as the phrase is spoken.
        function onWord(phase, pt, b, phrase, span = 0.30) {
            const st = cue(b, phrase);
            return beatGate(phase, pt, b, st, Math.min(0.99, st + span));
        }

        // ══════════════════ BEAT HELPERS ══════════════════
        let narrationDur = 9000;
        function appear(p, start, end) { if (p <= start) return 0; if (p >= end) return 1; const u = (p - start) / (end - start); return u * u * (3 - 2 * u); }
        function beatGate(phase, pt, b, s, e) { if (phase > b) return 1; if (phase < b) return 0; return appear(pt, s === undefined ? 0 : s, e === undefined ? 0.45 : e); }
        function beatRaw(phase, pt, b, s, e) {
            if (phase > b) return 1; if (phase < b) return 0;
            const a = (s === undefined ? 0 : s), z = (e === undefined ? 0.45 : e); const u = (pt - a) / (z - a); return u < 0 ? 0 : (u > 1 ? 1 : u);
        }

        // ══════════════════ GRAPH ENGINE (extended) ══════════════════
        // Section 4 is now built one element at a time — x-axis, then y-axis, then
        // A, then B–E, then the curve — so the axes must be able to grow
        // INDEPENDENTLY of each other. plotFrame replaces the old all-at-once
        // plotAxes for that section; plotAxes is kept for anything still using it.
        function plotFrame(P, {
            alpha = 1, xGrow = 0, yGrow = 0, grid = 0,
            xLabel = '', yLabel = '', xTicks = [], yTicks = [],
            xLabelA = 0, yLabelA = 0, tickA = 0,
            axisCol = 'rgba(255,255,255,0.55)', gridCol = 'rgba(255,255,255,0.08)'
        } = {}) {
            if (alpha <= 0) return;
            ctx.save(); ctx.globalAlpha = alpha;

            if (grid > 0) {
                ctx.globalAlpha = alpha * grid;
                yTicks.forEach(v => { const y = P.Y(v); draw.line(P.ox, y, P.ox + P.w * xGrow, y, { color: gridCol, width: 1 }); });
                xTicks.forEach(v => { const x = P.X(v); draw.line(x, P.oy, x, P.oy - P.h * yGrow, { color: gridCol, width: 1 }); });
                ctx.globalAlpha = alpha;
            }
            if (xGrow > 0) draw.arrow(P.ox, P.oy, P.ox + P.w * xGrow + 16, P.oy, { color: axisCol, width: 2.6 });
            if (yGrow > 0) draw.arrow(P.ox, P.oy, P.ox, P.oy - P.h * yGrow - 16, { color: axisCol, width: 2.6 });

            if (tickA > 0) {
                ctx.globalAlpha = alpha * tickA;
                xTicks.forEach(v => {
                    const x = P.X(v); if (x > P.ox + P.w * xGrow + 2) return;
                    draw.line(x, P.oy, x, P.oy + 6, { color: axisCol, width: 1.8 });
                    draw.text(String(v), x, P.oy + 21, { size: TYPE.body, color: 'rgba(255,255,255,0.72)', weight: '600' });
                });
                yTicks.forEach(v => {
                    const y = P.Y(v); if (y < P.oy - P.h * yGrow - 2) return;
                    draw.line(P.ox, y, P.ox - 6, y, { color: axisCol, width: 1.8 });
                    draw.text(String(v), P.ox - 18, y, { size: TYPE.body, color: 'rgba(255,255,255,0.72)', weight: '600', align: 'right' });
                });
                draw.text('0', P.ox - 16, P.oy + 19, { size: TYPE.body, color: 'rgba(255,255,255,0.72)', weight: '600' });
                ctx.globalAlpha = alpha;
            }
            if (xLabel && xLabelA > 0) {
                ctx.globalAlpha = alpha * xLabelA;
                draw.text(xLabel, P.ox + P.w / 2, P.oy + 50, { size: TYPE.label, color: EMERALD, weight: '800' });
                ctx.globalAlpha = alpha;
            }
            if (yLabel && yLabelA > 0) {
                ctx.globalAlpha = alpha * yLabelA;
                ctx.save(); ctx.translate(P.ox - 60, P.oy - P.h / 2); ctx.rotate(-Math.PI / 2);
                draw.text(yLabel, 0, 0, { size: TYPE.label, color: AMBER, weight: '800' }); ctx.restore();
                ctx.globalAlpha = alpha;
            }
            ctx.restore();
        }

        // A plotted point that drops in from above and lands with a ring —
        // movement rather than a plain fade.
        function dropPoint(P, x, y, label, {
            alpha = 1, drop = 1, color = AMBER, r = 9, dashes = 0, labelDx = 0, labelDy = -22, ring = 0
        } = {}) {
            if (alpha <= 0) return;
            const px = P.X(x), tgtY = P.Y(y);
            const py = tgtY - (1 - easeOut(drop)) * 90;
            ctx.save(); ctx.globalAlpha = alpha;
            if (dashes > 0 && drop >= 0.98) {
                ctx.globalAlpha = alpha * dashes;
                draw.line(P.ox, tgtY, px, tgtY, { color: hexA(color, 0.5), width: 1.6, dash: true });
                draw.line(px, P.oy, px, tgtY, { color: hexA(color, 0.5), width: 1.6, dash: true });
                ctx.globalAlpha = alpha;
            }
            if (ring > 0 && ring < 1) {
                ctx.globalAlpha = alpha * (1 - ring);
                ctx.beginPath(); ctx.arc(px, tgtY, 10 + ring * 28, 0, Math.PI * 2);
                ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
                ctx.globalAlpha = alpha;
            }
            draw.circle(px, py, r, { fill: color, glow: true, glowColor: color });
            if (label) draw.text(label, px + labelDx, py + labelDy, { size: TYPE.label, color: '#fff', weight: '800' });
            ctx.restore();
        }

        // Shades the barley gained / wheat given up between two points on the curve.
        function sacrificeWedge(P, from, to, a, { gainCol = EMERALD, lossCol = ROSE } = {}) {
            if (a <= 0) return;
            ctx.save(); ctx.globalAlpha = a;
            const x0 = P.X(from[0]), y0 = P.Y(from[1]), x1 = P.X(to[0]), y1 = P.Y(to[1]);
            rr(x0, y1, x1 - x0, 0.0001 + (P.oy - y1) - (P.oy - y1), 0, {});
            // barley gained — horizontal band
            ctx.fillStyle = hexA(gainCol, 0.22);
            ctx.fillRect(x0, y1, x1 - x0, 14);
            draw.arrow(x0, y1 + 7, x1, y1 + 7, { color: gainCol, width: 2.4 });
            // wheat given up — vertical band
            ctx.fillStyle = hexA(lossCol, 0.22);
            ctx.fillRect(x0 - 14, y0, 14, y1 - y0);
            draw.arrow(x0 - 7, y0, x0 - 7, y1, { color: lossCol, width: 2.4 });
            ctx.restore();
        }
        // ══════════════════ TOPIC ILLUSTRATIONS ══════════════════
        // Drawn in the same visual language as the rest of the module: medium
        // scale, top-left light source, shared INK outline, soft contact shadow.

        // A bank / financial institution — columned hall with a rupee crest.
        function drawBank(x, y, s, { t = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 160 * s, h = 104 * s;
            ground(0, h * 0.55, w * 0.5);
            poly([[-w / 2 - 8 * s, -h * 0.16], [0, -h * 0.56], [w / 2 + 8 * s, -h * 0.16]],
                { fill: shade(0, -h * 0.56, 0, -h * 0.16, [[0, '#dfe9f6'], [1, '#93a5bc']]), stroke: '#5f7189', width: 1.6 });
            for (let i = 0; i < 4; i++) {
                const cx = -w * 0.33 + i * w * 0.22;
                rr(cx - w * 0.05, -h * 0.16, w * 0.1, h * 0.5, 1.5 * s,
                    { fill: shade(cx, 0, cx + w * 0.1, 0, [[0, '#ffffff'], [1, '#b9c8da']]), stroke: '#7286a0', width: 1.1 });
            }
            rr(-w / 2 - 10 * s, h * 0.34, w + 20 * s, h * 0.12, 3 * s, { fill: '#93a5bc', stroke: '#6c7f96', width: 1.2 });
            ctx.beginPath(); ctx.arc(0, -h * 0.30, 11 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#2f6f4f'; ctx.fill();
            draw.text('\u20B9', 0, -h * 0.29, { size: 13 * s, color: '#eafff4', weight: '800' });
            ctx.restore();
        }

        // A bar chart on a page — used for data, analysis and reports.
        function drawChartDoc(x, y, s, { t = 0, grow = 1, tone = SKY } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 118 * s, h = 142 * s;
            ground(0, h * 0.55, w * 0.45);
            rr(-w / 2, -h / 2, w, h, 6 * s,
                { fill: shade(-w / 2, 0, w / 2, 0, [[0, '#ffffff'], [0.55, '#eef3fa'], [1, '#c6d2e2']]), stroke: '#8496ab', width: 1.6 });
            rr(-w * 0.34, -h * 0.40, w * 0.68, 5 * s, 2, { fill: '#9fb0c4' });
            const bars = [0.42, 0.68, 0.5, 0.86, 0.62];
            bars.forEach((bv, i) => {
                const bh = h * 0.34 * bv * Math.max(0, Math.min(1, grow * 1.4 - i * 0.1));
                if (bh <= 0) return;
                rr(-w * 0.34 + i * w * 0.145, h * 0.20 - bh, w * 0.10, bh, 2 * s,
                    { fill: i % 2 ? hexA(tone, 0.95) : hexA(EMERALD, 0.9) });
            });
            draw.line(-w * 0.38, h * 0.21, w * 0.38, h * 0.21, { color: '#8496ab', width: 1.6 });
            draw.line(-w * 0.38, h * 0.21, -w * 0.38, -h * 0.20, { color: '#8496ab', width: 1.6 });
            rr(-w * 0.34, h * 0.30, w * 0.5, 4 * s, 2, { fill: '#b9c6d6' });
            ctx.restore();
        }

        // A clipboard with ticked rows — surveys.
        function drawClipboard(x, y, s, { t = 0, ticks = 3 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 104 * s, h = 132 * s;
            ground(0, h * 0.55, w * 0.45);
            rr(-w / 2, -h / 2, w, h, 7 * s, { fill: '#8a6134', stroke: INK, width: 1.6 });
            rr(-w / 2 + 6 * s, -h / 2 + 12 * s, w - 12 * s, h - 20 * s, 4 * s, { fill: '#fdfdfa', stroke: '#b9c0ca', width: 1.2 });
            rr(-w * 0.17, -h / 2 - 5 * s, w * 0.34, 14 * s, 5 * s, { fill: '#b9c6d6', stroke: INK, width: 1.3 });
            for (let i = 0; i < 4; i++) {
                const ry = -h * 0.26 + i * h * 0.17;
                const on = i < ticks;
                rr(-w * 0.32, ry, 11 * s, 11 * s, 2 * s, { fill: on ? hexA(EMERALD, 0.9) : '#e3e8ef', stroke: '#9aa6b5', width: 1 });
                if (on) {
                    draw.line(-w * 0.30, ry + 6 * s, -w * 0.27, ry + 9 * s, { color: '#fff', width: 2 * s });
                    draw.line(-w * 0.27, ry + 9 * s, -w * 0.22, ry + 2 * s, { color: '#fff', width: 2 * s });
                }

        // A rolled policy scroll with a seal.
        function drawScroll(x, y, s, { t = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 132 * s, h = 104 * s;
            ground(0, h * 0.52, w * 0.42);
            rr(-w / 2, -h / 2 + 8 * s, w, h - 16 * s, 4 * s,
                { fill: shade(0, -h / 2, 0, h / 2, [[0, '#fdf6e3'], [1, '#e0d2ad']]), stroke: '#a3854a', width: 1.5 });
            for (let i = 0; i < 4; i++) rr(-w * 0.32, -h * 0.22 + i * h * 0.14, w * (0.64 - i * 0.06), 5 * s, 2, { fill: 'rgba(120,90,40,0.35)' });
            [-1, 1].forEach(sd => {
                rr(-w / 2 - 6 * s, sd * (h / 2 - 12 * s) - 8 * s, w + 12 * s, 16 * s, 8 * s,
                    { fill: shade(0, 0, 0, 16 * s, [[0, '#d9c48e'], [1, '#9a7c3f']]), stroke: '#7a5f2c', width: 1.4 });
            });
            ctx.beginPath(); ctx.arc(w * 0.28, h * 0.12, 12 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#c0392b'; ctx.fill(); ctx.strokeStyle = '#8a2a1e'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.restore();
        }

        // A briefcase — business consulting.
        function drawBriefcase(x, y, s, { t = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 130 * s, h = 94 * s;
            ground(0, h * 0.55, w * 0.45);
            rr(-w * 0.17, -h / 2 - 10 * s, w * 0.34, 16 * s, 5 * s, { stroke: '#6b5636', width: 3 * s });
            rr(-w / 2, -h / 2, w, h, 8 * s,
                { fill: shade(0, -h / 2, 0, h / 2, [[0, '#a9763c'], [0.5, '#8a6134'], [1, '#5e401f']]), stroke: INK, width: 1.7 });
            rr(-w / 2, -h * 0.08, w, 10 * s, 2, { fill: 'rgba(0,0,0,0.28)' });
            rr(-w * 0.09, -h * 0.12, w * 0.18, 18 * s, 4 * s, { fill: '#d9a441', stroke: INK, width: 1.3 });
            ctx.restore();
        }

        // A graduation cap over a book — research and education.
        function drawEducation(x, y, s, { t = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const w = 132 * s;
            ground(0, 40 * s, w * 0.42);
            rr(-w * 0.40, 8 * s, w * 0.80, 26 * s, 4 * s, { fill: '#3f5f8f', stroke: INK, width: 1.5 });
            rr(-w * 0.36, 12 * s, w * 0.72, 18 * s, 3 * s, { fill: '#f4f7fb' });
            draw.line(0, 12 * s, 0, 30 * s, { color: '#c3ccd8', width: 1.6 });
            poly([[0, -34 * s], [w * 0.44, -16 * s], [0, 2 * s], [-w * 0.44, -16 * s]],
                { fill: shade(-w * 0.44, -34 * s, w * 0.44, 2 * s, [[0, '#3d4a5d'], [1, '#1b2230']]), stroke: INK, width: 1.5 });
            rr(-w * 0.10, -16 * s, w * 0.20, 10 * s, 2 * s, { fill: '#2c3644' });
            draw.line(w * 0.30, -22 * s, w * 0.34, -2 * s + Math.sin(t * 2) * 2 * s, { color: '#f2c14e', width: 2.4 * s });
            ctx.beginPath(); ctx.arc(w * 0.34, -2 * s + Math.sin(t * 2) * 2 * s, 4 * s, 0, Math.PI * 2);
            ctx.fillStyle = '#f2c14e'; ctx.fill();
            ctx.restore();
        }

        // A coin stack with an upward trend arrow — finance / investment.
        function drawInvest(x, y, s, { t = 0, grow = 1 } = {}) {
            ctx.save(); ctx.translate(x, y);
            ground(0, 44 * s, 60 * s);
            const hs = [3, 4, 6];
            hs.forEach((n, c) => {
                const cx = (c - 1) * 40 * s;
                for (let i = 0; i < n; i++) {
                    const yy = 36 * s - i * 11 * s;
                    ctx.beginPath(); ctx.ellipse(cx, yy, 22 * s, 8 * s, 0, 0, Math.PI * 2);
                    ctx.fillStyle = shade(cx - 22 * s, 0, cx + 22 * s, 0, [[0, '#f0c75e'], [0.5, '#ffe9a8'], [1, '#d9a441']]);
                    ctx.fill(); ctx.strokeStyle = '#a5761c'; ctx.lineWidth = 1; ctx.stroke();
                }
            });
            const p = Math.max(0, Math.min(1, grow));

        // Four recognisable shoe types for 'for whom to produce'.
        // 'sports' defers to the supplied SVG so it stays the detailed asset.
        function drawShoeType(x, y, s, kind, { t = 0 } = {}) {
            if (kind === 'sports') { art.shoe(x, y, s * 0.92, { t }); return; }
            ctx.save(); ctx.translate(x, y);
            const w = 146 * s, h = 76 * s;
            ground(0, h * 0.40, w * 0.46);

            if (kind === 'casual') {
                // an open slipper: flat sole plus one wide strap over the foot
                rr(-w / 2, h * 0.10, w, h * 0.24, h * 0.12, { fill: '#e0cba6', stroke: INK, width: 1.4 });
                rr(-w / 2, h * 0.04, w, h * 0.09, h * 0.05, { fill: '#f2e6cd', stroke: 'rgba(0,0,0,0.18)', width: 1 });
                ctx.beginPath();
                ctx.moveTo(-w * 0.28, h * 0.06);
                ctx.quadraticCurveTo(-w * 0.04, -h * 0.44, w * 0.24, h * 0.06);
                ctx.lineWidth = 13 * s; ctx.strokeStyle = '#c0632f'; ctx.lineCap = 'round'; ctx.stroke();
                ctx.lineWidth = 1.4; ctx.strokeStyle = INK; ctx.stroke();
                ctx.restore(); return;
            }

            // Same proven silhouette as art.shoe — low toe rising to a single
            // heel peak — so school and office read unmistakably as shoes.
            // Only colour and the surface detail change between the two.
            const body = kind === 'office'
                ? [[0, '#8a5a2b'], [0.5, '#6b3f18'], [1, '#42250c']]
                : [[0, '#41506b'], [0.5, '#2b3549'], [1, '#171e2b']];
            const soleCol = kind === 'office' ? '#33200f' : '#cfd6e0';
            const heelX = -w * 0.47, toeX = w * 0.49, soleY = h * 0.07;
            const heelPeak = [heelX + w * 0.14, -h * 0.56];

            rr(-w * 0.48, h * 0.14, w * 0.96, h * 0.20, h * 0.09, { fill: soleCol, stroke: INK, width: 1.3 });
            ctx.beginPath();
            ctx.moveTo(heelX, soleY);
            ctx.quadraticCurveTo(heelX - w * 0.01, -h * 0.30, heelPeak[0], heelPeak[1]);
            ctx.quadraticCurveTo(heelX + w * 0.42, -h * 0.50, heelX + w * 0.62, -h * 0.33);
            ctx.quadraticCurveTo(heelX + w * 0.80, -h * 0.19, toeX, -h * 0.06);
            ctx.quadraticCurveTo(toeX + w * 0.01, soleY * 1.4, toeX - w * 0.03, soleY);
            ctx.lineTo(heelX, soleY);
            ctx.closePath();
            ctx.fillStyle = shade(heelX, -h / 2, toeX, h / 2, body);
            ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.7; ctx.stroke();

            // heel counter, confined to the back
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(heelX, soleY);
            ctx.quadraticCurveTo(heelX - w * 0.01, -h * 0.30, heelPeak[0], heelPeak[1]);
            ctx.quadraticCurveTo(heelX + w * 0.30, -h * 0.42, heelX + w * 0.30, -h * 0.20);
            ctx.quadraticCurveTo(heelX + w * 0.20, soleY, heelX + w * 0.10, soleY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fill();
            ctx.restore();

            if (kind === 'office') {
                // polished leather: a broad highlight plus a toe-cap seam
                ctx.beginPath();
                ctx.ellipse(-w * 0.06, -h * 0.24, w * 0.20, h * 0.12, -0.28, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.26)'; ctx.fill();
                ctx.beginPath();
                ctx.moveTo(w * 0.16, -h * 0.26); ctx.quadraticCurveTo(w * 0.24, -h * 0.04, w * 0.24, soleY);
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.8; ctx.stroke();
            } else {
                // school shoe: a simple buckled strap across the vamp
                ctx.beginPath();
                ctx.moveTo(-w * 0.10, -h * 0.30); ctx.lineTo(w * 0.20, -h * 0.20);
                ctx.lineWidth = 8 * s; ctx.strokeStyle = '#0f1622'; ctx.lineCap = 'butt'; ctx.stroke();
                rr(w * 0.02, -h * 0.32, 11 * s, 12 * s, 2 * s, { fill: '#d9c06a', stroke: INK, width: 1 });
            }
            ctx.restore();
        }

        // A water droplet with a level, used for the water-use contrast.
        function drawWaterUse(x, y, s, { level = 1, t = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);
            const R = 34 * s;
            ctx.beginPath();
            ctx.moveTo(0, -R * 1.5);
            ctx.bezierCurveTo(R * 1.05, -R * 0.25, R * 0.78, R, 0, R);
            ctx.bezierCurveTo(-R * 0.78, R, -R * 1.05, -R * 0.25, 0, -R * 1.5);
            ctx.closePath();
            ctx.save(); ctx.clip();
            ctx.fillStyle = 'rgba(120,190,235,0.18)'; ctx.fillRect(-R * 1.2, -R * 1.6, R * 2.4, R * 2.8);
            const top = R - (R * 2.2) * Math.max(0, Math.min(1, level));
            ctx.fillStyle = shade(0, top, 0, R, [[0, '#7fdcff'], [1, '#1173b8']]);
            ctx.fillRect(-R * 1.2, top, R * 2.4, R * 2.6);
            ctx.beginPath(); ctx.moveTo(-R * 1.2, top);
            for (let i = -R * 1.2; i <= R * 1.2; i += 5) ctx.lineTo(i, top + Math.sin(i * 0.14 + t * 2.4) * 2 * s);
            ctx.lineTo(R * 1.2, top + 30); ctx.lineTo(-R * 1.2, top + 30); ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
            ctx.restore();
            ctx.strokeStyle = 'rgba(190,235,255,0.85)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        }

            ctx.save(); ctx.translate(x, y);

            ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);

            ctx.save();
            ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();

            const off = (t * 12) % (R * 2.4);
            [[-30, -14, 26, 16], [10, 12, 30, 18], [34, -22, 18, 12]].forEach(m => {
                ctx.beginPath();
                ctx.ellipse(((m[0] * s + off + R * 1.2) % (R * 2.4)) - R * 1.2, m[1] * s, m[2] * s, m[3] * s, 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#4a9c4f'; ctx.fill();

        // A balance beam with two pans — the mixed economy's two forces.
        function drawBalance(x, y, s, { t = 0, tilt = 0 } = {}) {
            ctx.save(); ctx.translate(x, y);

            draw.line(0, 10 * s, 0, -46 * s, { color: '#8d9cb2', width: 5 * s });
